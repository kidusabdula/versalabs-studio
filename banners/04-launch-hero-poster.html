<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>VersaLabs Studio — Digital Headquarters Now Live</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #0D0D0F;
    font-family: 'Outfit', sans-serif;
    position: relative;
  }

  /* ── Background Grid ── */
  .bg-grid {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: center center;
    mask-image: radial-gradient(ellipse 900px 600px at 50% 42%, rgba(0,0,0,0.6) 0%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 900px 600px at 50% 42%, rgba(0,0,0,0.6) 0%, transparent 100%);
    z-index: 0;
  }

  /* ── Ambient Glow Blob ── */
  .ambient-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -58%);
    width: 1100px;
    height: 700px;
    background: radial-gradient(ellipse at center,
      rgba(167, 139, 250, 0.13) 0%,
      rgba(129, 100, 230, 0.08) 25%,
      rgba(99, 70, 200, 0.04) 45%,
      transparent 70%
    );
    filter: blur(80px);
    z-index: 1;
    animation: glowPulse 6s ease-in-out infinite;
  }

  .ambient-glow-2 {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 800px;
    height: 500px;
    background: radial-gradient(ellipse at center,
      rgba(129, 100, 255, 0.1) 0%,
      rgba(88, 60, 200, 0.05) 40%,
      transparent 70%
    );
    filter: blur(60px);
    z-index: 1;
    animation: glowPulse 6s ease-in-out 3s infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
    50% { opacity: 0.7; transform: translate(-50%, -58%) scale(1.06); }
  }

  /* ── Geometric Wire Accents ── */
  .wire-accent {
    position: absolute;
    border: 1px solid rgba(167, 139, 250, 0.06);
    z-index: 2;
  }

  .wire-accent-1 {
    top: 80px;
    left: 60px;
    width: 120px;
    height: 120px;
    transform: rotate(45deg);
    border-radius: 4px;
  }

  .wire-accent-2 {
    bottom: 90px;
    right: 70px;
    width: 90px;
    height: 90px;
    transform: rotate(30deg);
    border-radius: 50%;
  }

  .wire-accent-3 {
    top: 200px;
    right: 140px;
    width: 60px;
    height: 60px;
    transform: rotate(15deg);
    border-color: rgba(167, 139, 250, 0.04);
  }

  .wire-accent-4 {
    bottom: 200px;
    left: 100px;
    width: 50px;
    height: 80px;
    transform: rotate(-20deg);
    border-color: rgba(255,255,255, 0.03);
    border-radius: 2px;
  }

  .wire-accent-5 {
    top: 350px;
    left: 40px;
    width: 1px;
    height: 140px;
    border: none;
    background: linear-gradient(to bottom, transparent, rgba(167,139,250,0.06), transparent);
  }

  .wire-accent-6 {
    top: 280px;
    right: 50px;
    width: 1px;
    height: 180px;
    border: none;
    background: linear-gradient(to bottom, transparent, rgba(167,139,250,0.05), transparent);
  }

  .wire-accent-7 {
    bottom: 160px;
    left: 280px;
    width: 70px;
    height: 70px;
    transform: rotate(60deg);
    border-color: rgba(255,255,255, 0.02);
  }

  .wire-accent-8 {
    top: 120px;
    right: 320px;
    width: 40px;
    height: 40px;
    transform: rotate(22deg);
    border-radius: 50%;
    border-color: rgba(167,139,250, 0.04);
  }

  /* ── Corner Content ── */
  .corner-tl {
    position: absolute;
    top: 48px;
    left: 64px;
    z-index: 10;
    font-size: 18px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.01em;
  }

  .corner-tl span {
    background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.75));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .corner-tr {
    position: absolute;
    top: 52px;
    right: 64px;
    z-index: 10;
    font-size: 13px;
    font-weight: 400;
    color: #71717a;
  }

  .corner-bl {
    position: absolute;
    bottom: 48px;
    left: 64px;
    z-index: 10;
    font-size: 12px;
    font-weight: 400;
    color: #52525b;
  }

  .corner-br {
    position: absolute;
    bottom: 48px;
    right: 64px;
    z-index: 10;
    font-size: 12px;
    font-weight: 400;
    color: #52525b;
    letter-spacing: 0.02em;
  }

  .corner-br span {
    margin: 0 6px;
    opacity: 0.4;
  }

  /* ── Center Composition ── */
  .center-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
    margin-top: -30px;
  }

  /* ── 3D Browser Mockup ── */
  .browser-wrapper {
    perspective: 1800px;
    margin-bottom: 52px;
  }

  .browser-mockup {
    width: 820px;
    height: 520px;
    background: #161618;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    overflow: hidden;
    transform: rotateX(8deg) rotateY(-3deg) rotateZ(0.5deg);
    box-shadow:
      0 0 80px rgba(167, 139, 250, 0.08),
      0 0 160px rgba(129, 100, 230, 0.04),
      0 30px 60px rgba(0,0,0,0.5),
      0 0 0 1px rgba(167, 139, 250, 0.06),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
  }

  /* ── Browser Top Bar ── */
  .browser-bar {
    width: 100%;
    height: 40px;
    background: #111113;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 8px;
    position: relative;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .dot-red { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green { background: #28c840; }

  .browser-url {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 400;
    color: #52525b;
    background: rgba(255,255,255,0.03);
    padding: 4px 20px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.04);
    letter-spacing: 0.02em;
  }

  /* ── Browser Content Area ── */
  .browser-content {
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Nav bar mockup */
  .mock-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .mock-nav-logo {
    width: 80px;
    height: 10px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
  }

  .mock-nav-links {
    display: flex;
    gap: 16px;
  }

  .mock-nav-link {
    width: 40px;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
  }

  .mock-nav-link:nth-child(2) { width: 48px; }
  .mock-nav-link:nth-child(3) { width: 36px; }
  .mock-nav-link:nth-child(4) { width: 52px; }

  /* Hero section mockup */
  .mock-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 0 12px;
  }

  .mock-heading {
    width: 420px;
    height: 16px;
    background: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0.12));
    border-radius: 4px;
  }

  .mock-subtitle-1 {
    width: 320px;
    height: 8px;
    background: rgba(82, 82, 91, 0.5);
    border-radius: 3px;
  }

  .mock-subtitle-2 {
    width: 260px;
    height: 8px;
    background: rgba(82, 82, 91, 0.35);
    border-radius: 3px;
  }

  .mock-cta-row {
    display: flex;
    gap: 12px;
    margin-top: 6px;
  }

  .mock-cta {
    width: 90px;
    height: 28px;
    border-radius: 6px;
    background: rgba(167, 139, 250, 0.15);
    border: 1px solid rgba(167, 139, 250, 0.12);
  }

  .mock-cta-secondary {
    width: 90px;
    height: 28px;
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* Stat cards mockup */
  .mock-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 4px;
  }

  .mock-stat-card {
    width: 220px;
    height: 72px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mock-stat-number {
    width: 60px;
    height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
  }

  .mock-stat-label {
    width: 100px;
    height: 6px;
    background: rgba(82, 82, 91, 0.4);
    border-radius: 2px;
  }

  .mock-stat-card:nth-child(2) .mock-stat-number { width: 45px; }
  .mock-stat-card:nth-child(2) .mock-stat-label { width: 80px; }
  .mock-stat-card:nth-child(3) .mock-stat-number { width: 70px; }
  .mock-stat-card:nth-child(3) .mock-stat-label { width: 110px; }

  /* Project cards grid mockup */
  .mock-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 2px;
  }

  .mock-project-card {
    height: 80px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.035);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .mock-card-title {
    width: 80px;
    height: 7px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
  }

  .mock-card-desc {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .mock-card-line {
    height: 5px;
    background: rgba(82, 82, 91, 0.3);
    border-radius: 2px;
  }

  .mock-card-line:nth-child(1) { width: 100%; }
  .mock-card-line:nth-child(2) { width: 70%; }

  .mock-project-card:nth-child(2) .mock-card-title { width: 100px; }
  .mock-project-card:nth-child(3) .mock-card-title { width: 65px; }
  .mock-project-card:nth-child(4) .mock-card-title { width: 90px; }
  .mock-project-card:nth-child(5) .mock-card-title { width: 70px; }
  .mock-project-card:nth-child(6) .mock-card-title { width: 110px; }

  /* ── Headline Text ── */
  .headline {
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.1;
    background: linear-gradient(to bottom, #ffffff, rgba(255,255,255,0.4));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    margin-bottom: 10px;
  }

  .headline-url {
    font-size: 16px;
    font-weight: 400;
    color: #a1a1aa;
    letter-spacing: 0.02em;
    text-align: center;
  }

  /* ── Particles ── */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    z-index: 3;
    pointer-events: none;
  }

  .p1  { top: 8%;   left: 12%;  width: 2px; height: 2px; opacity: 0.12; }
  .p2  { top: 15%;  left: 28%;  width: 1.5px; height: 1.5px; opacity: 0.18; }
  .p3  { top: 5%;   left: 45%;  width: 2px; height: 2px; opacity: 0.1; }
  .p4  { top: 12%;  left: 65%;  width: 1px; height: 1px; opacity: 0.2; }
  .p5  { top: 8%;   left: 82%;  width: 2px; height: 2px; opacity: 0.14; }
  .p6  { top: 22%;  left: 8%;   width: 1.5px; height: 1.5px; opacity: 0.1; }
  .p7  { top: 30%;  left: 18%;  width: 1px; height: 1px; opacity: 0.16; }
  .p8  { top: 25%;  left: 55%;  width: 2px; height: 2px; opacity: 0.12; }
  .p9  { top: 35%;  left: 90%;  width: 1.5px; height: 1.5px; opacity: 0.15; }
  .p10 { top: 42%;  left: 5%;   width: 2px; height: 2px; opacity: 0.1; }
  .p11 { top: 55%;  left: 10%;  width: 1px; height: 1px; opacity: 0.18; }
  .p12 { top: 60%;  left: 88%;  width: 2px; height: 2px; opacity: 0.12; }
  .p13 { top: 70%;  left: 15%;  width: 1.5px; height: 1.5px; opacity: 0.14; }
  .p14 { top: 75%;  left: 78%;  width: 2px; height: 2px; opacity: 0.1; }
  .p15 { top: 80%;  left: 40%;  width: 1px; height: 1px; opacity: 0.2; }
  .p16 { top: 85%;  left: 60%;  width: 1.5px; height: 1.5px; opacity: 0.12; }
  .p17 { top: 90%;  left: 25%;  width: 2px; height: 2px; opacity: 0.1; }
  .p18 { top: 18%;  left: 92%;  width: 1px; height: 1px; opacity: 0.16; }
  .p19 { top: 48%;  left: 95%;  width: 1.5px; height: 1.5px; opacity: 0.12; }
  .p20 { top: 65%;  left: 3%;   width: 2px; height: 2px; opacity: 0.14; }
  .p21 { top: 38%;  left: 3%;   width: 1px; height: 1px; opacity: 0.18; }
  .p22 { top: 92%;  left: 85%;  width: 1.5px; height: 1.5px; opacity: 0.1; }
  .p23 { top: 3%;   left: 35%;  width: 2px; height: 2px; opacity: 0.15; }
  .p24 { top: 50%;  left: 93%;  width: 1px; height: 1px; opacity: 0.12; }
  .p25 { top: 72%;  left: 92%;  width: 1.5px; height: 1.5px; opacity: 0.16; }
  .p26 { top: 88%;  left: 10%;  width: 2px; height: 2px; opacity: 0.11; }
  .p27 { top: 28%;  left: 75%;  width: 1px; height: 1px; opacity: 0.19; }
  .p28 { top: 44%;  left: 22%;  width: 1.5px; height: 1.5px; opacity: 0.13; }
  .p29 { top: 16%;  left: 50%;  width: 2px; height: 2px; opacity: 0.1; }
  .p30 { top: 95%;  left: 50%;  width: 1px; height: 1px; opacity: 0.17; }

  /* ── Floating Shine Line ── */
  .shine-line {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(167,139,250,0.12), rgba(255,255,255,0.06), rgba(167,139,250,0.12), transparent);
    z-index: 4;
  }

  .shine-line-bottom {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), rgba(255,255,255,0.05), rgba(255,255,255,0.03), transparent);
    z-index: 4;
  }

  /* ── Reflection under mockup ── */
  .mockup-reflection {
    position: absolute;
    top: calc(50% + 230px);
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 120px;
    background: linear-gradient(to bottom, rgba(167, 139, 250, 0.03), transparent);
    filter: blur(30px);
    z-index: 2;
  }

  /* ── Vertical accent lines at far edges ── */
  .edge-line-left {
    position: absolute;
    top: 0;
    left: 180px;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 10%, rgba(255,255,255,0.015) 30%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.015) 70%, transparent 90%);
    z-index: 1;
  }

  .edge-line-right {
    position: absolute;
    top: 0;
    right: 180px;
    width: 1px;
    height: 100%;
    background: linear-gradient(to bottom, transparent 10%, rgba(255,255,255,0.015) 30%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.015) 70%, transparent 90%);
    z-index: 1;
  }

  /* Subtle cross-hair accents */
  .crosshair {
    position: absolute;
    z-index: 3;
  }

  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(167, 139, 250, 0.06);
  }

  .crosshair::before {
    width: 16px;
    height: 1px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .crosshair::after {
    width: 1px;
    height: 16px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .crosshair-1 { top: 160px; left: 300px; }
  .crosshair-2 { bottom: 180px; right: 280px; }

  /* ── Now-Live dot pulse ── */
  .live-dot-wrapper {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #a78bfa;
    position: relative;
    animation: livePulse 2s ease-in-out infinite;
  }

  .live-dot::after {
    content: '';
    position: absolute;
    top: -4px;
    left: -4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(167, 139, 250, 0.25);
    animation: livePulseRing 2s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @keyframes livePulseRing {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.6); opacity: 0; }
  }

  .live-label {
    font-size: 12px;
    font-weight: 500;
    color: #a78bfa;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
