<svg data-source-sha256="642879eb15d4f8ce1b2864b3b849a101bc931ec4d385a40dcc96dda442e399ea" aria-labelledby="chart-title-diagram-obsidian-erp" aria-describedby="chart-desc-diagram-obsidian-erp" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 574.3973388671875 689.3046264648438" style="max-width: 574.3973388671875px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-obsidian-erp"><title id="chart-title-diagram-obsidian-erp">Obsidian ERP architecture</title><desc id="chart-desc-diagram-obsidian-erp">ERPNext DocType metadata generates TypeScript types and Zod schemas, which fill a DocType registry. Generic hooks and factory API routes are built from the registry. Next.js pages use the hooks and the flow engine, and every API route calls ERPNext as the signed-in user, so ERPNext's own role permissions apply.</desc><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-obsidian-erp_flowchart-v2-pointEnd"><path class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-obsidian-erp_flowchart-v2-pointStart"><path class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-obsidian-erp_flowchart-v2-circleEnd"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-obsidian-erp_flowchart-v2-circleStart"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto"