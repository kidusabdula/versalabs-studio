<svg data-source-sha256="d3aadff938ef1be0a3104e3b073658ee86883b61cc6410bdc920a688606f87a4" aria-labelledby="chart-title-diagram-versa-estate" aria-describedby="chart-desc-diagram-versa-estate" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 827.5599975585938 630.0716552734375" style="max-width: 827.5599975585938px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-versa-estate"><title id="chart-title-diagram-versa-estate">Versa Estate architecture</title><desc id="chart-desc-diagram-versa-estate">The browser uses TanStack Query factory hooks. Queries go through PostgREST and Row Level Security to the tables. Workflow steps (reserve, activate, verify, bill) go through RPC to security-definer functions, and guard triggers reject direct status edits. pg_cron runs expiries, the lease lifecycle and the overdue digest, Realtime drives the notification bell, and the Next.js server refreshes sessions and handles member invites.</desc><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-versa-estate_flowchart-v2-pointEnd"><path class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-versa-estate_flowchart-v2-pointStart"><path class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-versa-estate_flowchart-v2-circleEnd"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-versa-estat