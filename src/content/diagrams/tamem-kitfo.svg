<svg data-source-sha256="4733678339cb3e3095db34f74fd2dcf09512773fbef60986d4440220ecce2796" aria-labelledby="chart-title-diagram-tamem-kitfo" aria-describedby="chart-desc-diagram-tamem-kitfo" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 742.4130859375 644.0238647460938" style="max-width: 742.4130859375px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-tamem-kitfo"><title id="chart-title-diagram-tamem-kitfo">Tamem Kitfo architecture</title><desc id="chart-desc-diagram-tamem-kitfo">The public site, prerendered in English and Amharic, reads through one query module that falls back to bundled fixtures if Supabase is down. Public forms post to server-only API routes that use the service role. Staff use the CMS through a cookie-bound Supabase client, so Row Level Security checks the signed-in staff member. Orders post a Telegram card with status buttons, and a secret-checked webhook updates the status, redraws the card and revalidates the CMS.</desc><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-tamem-kitfo_flowchart-v2-pointEnd"><path class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-tamem-kitfo_flowchart-v2-pointStart"><path class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-tamem-kitfo_flowchart-v2-circleEnd"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id=