<svg data-source-sha256="df832d0c7fae16d2254930a608eda1f3c4c0fda8864838fae00a3671ed64603d" aria-labelledby="chart-title-diagram-eventology" aria-describedby="chart-desc-diagram-eventology" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 604.519775390625 505.7362060546875" style="max-width: 604.519775390625px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-eventology"><title id="chart-title-diagram-eventology">Eventology architecture</title><desc id="chart-desc-diagram-eventology">The Next.js web app and the Expo mobile app share packages for schemas, locales, config, utilities, AI and wallet passes. Both call public read routes and protected routes. Protected routes turn the better-auth session into a signed Supabase JWT, so Row Level Security applies in Supabase PostgreSQL. Payments, email, SMS, push, AI and wallet passes sit behind provider seams that default to stubs.</desc><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-eventology_flowchart-v2-pointEnd"><path class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-eventology_flowchart-v2-pointStart"><path class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-eventology_flowchart-v2-circleEnd"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-eventology_flowchart-v2-circleStart"><circle class="arrowMarkerP