<svg data-source-sha256="87456834de8148e2ecf51aae41be307a864d0ff7368d340982153e6a08d9b9a1" aria-labelledby="chart-title-diagram-safeframe" aria-describedby="chart-desc-diagram-safeframe" aria-roledescription="flowchart-v2" role="graphics-document document" viewBox="0 0 710.4011840820312 828" style="max-width: 710.4011840820312px;" class="flowchart" xmlns="http://www.w3.org/2000/svg" width="100%" id="diagram-safeframe"><title id="chart-title-diagram-safeframe">SafeFrame architecture</title><desc id="chart-desc-diagram-safeframe">A shared TypeScript core (payload schema, scoring, aggregation and device-tier policy) is used unchanged by the web app, the Expo app and the browser extension. In the web app, a seek sampler feeds every sampled frame to the NSFWJS screener. Only borderline frames go on to the Vision Transformer verifier in a Web Worker, and both scores reach the aggregator, which produces the verdict. Everything runs on the device, with no server.</desc><g><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-safeframe_flowchart-v2-pointEnd"><path class="arrowMarkerPath" d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker orient="auto" markerHeight="8" markerWidth="8" markerUnits="userSpaceOnUse" refY="5" refX="4.5" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-safeframe_flowchart-v2-pointStart"><path class="arrowMarkerPath" d="M 0 5 L 10 10 L 10 0 z"></path></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="11" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-safeframe_flowchart-v2-circleEnd"><circle class="arrowMarkerPath" r="5" cy="5" cx="5"></circle></marker><marker orient="auto" markerHeight="11" markerWidth="11" markerUnits="userSpaceOnUse" refY="5" refX="-1" viewBox="0 0 10 10" class="marker flowchart-v2" id="diagram-safeframe_flowchart-v2-circleStart"><circle clas